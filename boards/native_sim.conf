# native_sim has no async UART or DMA. ECP commands use the simulator backend instead.
CONFIG_UART_ASYNC_API=n
CONFIG_DMA=n

# Needed for REBOOT, ESTOP and BOOT_JUMP. The UART backend enables it by default.
CONFIG_ECP_DEVICE_CMD_IN_PROGRESS_STATUS=y

# Not supported on native_sim
CONFIG_THREAD_ANALYZER=n
