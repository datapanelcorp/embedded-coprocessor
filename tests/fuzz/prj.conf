CONFIG_ARCH_POSIX_LIBFUZZER=y
CONFIG_ASAN=y
CONFIG_UBSAN=y
CONFIG_ASSERT=y

CONFIG_ECP_DEVICE_CMD_BACKEND_SIMULATOR=y
CONFIG_ECP_DEVICE_CMD_DEDICATED_THREAD=y
CONFIG_ECP_DEVICE_CMD_IN_PROGRESS_STATUS=y

# On native_sim, PEEK and POKE accept any address, so random inputs would crash in
# them. On the target, they're limited to valid memory ranges.
CONFIG_APP_ECP_PEEK_POKE=n

CONFIG_GPIO=y
CONFIG_EVENTS=y
CONFIG_REBOOT=y
CONFIG_DP_METRICS=y

CONFIG_BINDESC=y
CONFIG_BINDESC_DEFINE=y
CONFIG_BINDESC_DEFINE_VERSION=y
CONFIG_BINDESC_DP_SW_PART_NUMBER=y

# Match the application: the port handler thread is started by ENUM
CONFIG_DP_PORTS_HANDLER_DEDICATED_THREAD=n

# Logging every rejected frame slows fuzzing down
CONFIG_LOG=n
